version: '3.5'
networks:
  avado:
    external: true
volumes:
  binddnpdappnodeeth_data: {}
services:
  bind.dnp.dappnode.eth:
    build: ./build
    image: 'bind.dnp.dappnode.eth:10.0.6'
    container_name: DAppNodeCore-bind.dnp.dappnode.eth
    restart: always
    volumes:
      - 'binddnpdappnodeeth_data:/etc/bind'
    environment:
      - EXTRA_OPTS=
    networks:
      avado:
        ipv4_address: 172.30.0.2
    logging:
      options:
        max-size: 10m
        max-file: '3'
